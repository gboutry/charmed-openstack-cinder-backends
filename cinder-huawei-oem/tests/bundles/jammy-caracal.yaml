series: jammy
variables:
  openstack-origin: &openstack-origin cloud:jammy-caracal
comment:
- 'machines section to decide order of deployment. database sooner = faster'
machines:
  '0':
    constraints: mem=3072M
  '1':
    constraints: mem=3072M
  '2':
    constraints: mem=3072M
  '3':
  '4':
  '5':
    constraints: mem=4G root-disk=16G
local_overlay_enabled: false

applications:
  mysql-innodb-cluster:
    charm: ch:mysql-innodb-cluster
    channel: latest/edge
    num_units: 3
    options:
      source: *openstack-origin
    to:
      - '0'
      - '1'
      - '2'
  rabbitmq-server:
    charm: ch:rabbitmq-server
    channel: latest/edge
    num_units: 1
    options:
      source: *openstack-origin
    to:
      - '3'
  keystone:
    charm: ch:keystone
    channel: 2024.1/edge
    num_units: 1
    options:
      openstack-origin: *openstack-origin
    to:
      - '4'
  keystone-mysql-router:
    channel: latest/edge
    charm: ch:mysql-router
  cinder:
    charm: ch:cinder
    channel: 2024.1/edge
    num_units: 1
    options:
      openstack-origin: *openstack-origin
      block-device: None
      overwrite: "true"
    to:
      - '5'
  cinder-huawei-oem:
    charm: ../../cinder-huawei-oem.charm
    options:
      product: "Dorado"
      username: "username"
      password: "Passw0rd1"
      storage-pool: "StorPool"
      default-targetip: "192.0.2.10"
      rest-url: "https://example.com:8088/deviceManager/rest/"
  cinder-mysql-router:
    channel: latest/edge
    charm: ch:mysql-router

relations:
- [ keystone-mysql-router:db-router, mysql-innodb-cluster:db-router ]
- [ keystone-mysql-router:shared-db, keystone:shared-db ]
- [ cinder-mysql-router:db-router, mysql-innodb-cluster:db-router ]
- [ cinder-mysql-router:shared-db, cinder:shared-db ]
- [ cinder:identity-service, keystone:identity-service ]
- [ cinder:amqp, rabbitmq-server:amqp ]
- [ cinder:storage-backend, cinder-huawei-oem:storage-backend ]
